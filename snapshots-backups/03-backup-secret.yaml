apiVersion: v1
kind: Secret
metadata:
  name: longhorn-backups-secret
  namespace: longhorn-system
type: Opaque
stringData:
  # Replace these with your actual S3-compatible storage credentials.
  # For GarageHQ: https://garagehq.deuxfleurs.fr/
  # For MinIO: use your MinIO endpoint.
  # For AWS S3: use the standard AWS endpoint.
  AWS_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
  # GarageHQ endpoint (change to your own endpoint).
  AWS_ENDPOINTS: "https://your-garage-endpoint.example.com"
  # Optional: bucket name (some implementations include it in the endpoint URL).
  # AWS_BUCKET: "longhorn-backups"
